# Opiinio on Netlify (decisions 0020, 0022): the React frontend (frontend/,
# Vite) is built into public/ and served from the Netlify CDN; the API runs
# as a serverless function. `npm run build` runs tsc (rootDir ".") which
# compiles src/functions/api.ts into dist/src/functions/api.js — the
# functions directory must point there (dist/functions does NOT exist;
# that was a shipped bug, fixed in 0020) — then installs frontend deps and
# runs the Vite build into public/.
[build]
  command = "npm run build"
  publish = "public"
  functions = "dist/src/functions"

# Rewrite (200, not redirect): the original /api/* URL is preserved, so the
# function's event.path is the API path route() expects. Everything else
# falls through to the static files in public/.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200
