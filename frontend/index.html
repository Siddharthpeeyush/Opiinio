<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Opiinio — every opinion matters. Text-only opinions, debates, and polls."
    />
    <title>Opiinio — Every Opinion Matters</title>
    <script>
      // Set the theme before first paint (no light/dark flash).
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem("opiinio.theme") === "light" ? "light" : "dark";
      } catch (e) {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
    <style>
      /* Inline critical paint: background before the bundle loads. */
      html,
      body {
        background: #070b16;
        margin: 0;
      }
      html[data-theme="light"],
      html[data-theme="light"] body {
        background: #f4f5fa;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
